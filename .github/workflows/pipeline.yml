name: Pipeline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-runtime.txt -r requirements-analytics.txt -r requirements-streaming.txt
      - run: python -m unittest discover -s tests -v

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -r requirements-runtime.txt -r requirements-spark.txt
      - run: python -m unittest tests.test_spark -v
        env:
          OLIST_TEST_SPARK: '1'
          SPARK_LOCAL_IP: 127.0.0.1

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/configure_local.py
      - name: Validate Compose configurations without displaying secrets
        run: docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.airflow.yml config --quiet
      - name: Start PostgreSQL and Kafka
        run: docker compose --env-file .env -f docker/docker-compose.yml --profile streaming up -d --wait postgres kafka
      - name: Build the application and test real services
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml build pipeline
          docker compose --env-file .env -f docker/docker-compose.yml run --rm pipeline python scripts/verify_services.py --with-kafka
      - name: Build and start Airflow
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.airflow.yml build airflow-init
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.airflow.yml up -d --wait airflow-apiserver airflow-scheduler airflow-dag-processor
      - name: Validate and execute the Airflow DAG
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.airflow.yml run --rm -e OLIST_TEST_AIRFLOW=1 airflow-scheduler python -m unittest tests.test_airflow -v
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.airflow.yml run --rm airflow-scheduler python scripts/test_airflow_dag.py
      - name: Stop services
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.airflow.yml --profile streaming down
